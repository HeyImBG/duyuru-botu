name: GTÜ Duyuru Kontrolü

on:
  workflow_dispatch: # cron-job.org API tetiklemesi ve manuel buton için

permissions:
  contents: write # seen_announcements.json dosyasını repoya pushlamak için gerekli

concurrency:
  group: announcement-checker
  cancel-in-progress: false

jobs:
  check-announcements:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Duyuruları Kontrol Et
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tracker.py

      - name: Değişiklik Varsa Geçmişi Kaydet ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_announcements.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: duyuru geçmişi güncellendi [skip ci]"
            git push
          else
            echo "Herhangi bir değişiklik yok, commit atılmadı."
          fi
